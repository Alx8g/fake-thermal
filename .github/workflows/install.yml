name: One-command installation
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['devin/**']
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS
        if: runner.os == 'macOS'
        env:
          FAKE_THERMAL_SOURCE: ${{ github.workspace }}
        run: sh install.sh
      - name: Install Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install.ps1 -Source $pwd.Path
      - name: Verify macOS in a fresh shell
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v fake-thermal
          root="$HOME/Library/Application Support/fake-thermal"
          fake-thermal "$root/verification-input.mp4" -o "$root/ci.mp4"
          "$root/venv/bin/python" scripts/check_install.py
          sh install.sh --uninstall
          test ! -e "$root"
          test ! -e "$HOME/.local/bin/fake-thermal"
          test ! -e "$HOME/.fake-thermal-resolve.json"
      - name: Verify Windows in a fresh shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          Get-Command fake-thermal -ErrorAction Stop
          $root = "$env:LOCALAPPDATA\fake-thermal"
          fake-thermal "$root\verification-input.mp4" -o "$root\ci.mp4"
          if ($LASTEXITCODE) { throw 'Render failed' }
          & "$root\venv\Scripts\python.exe" scripts/check_install.py
          if ($LASTEXITCODE) { throw 'Verification failed' }
          ./install.ps1 -Source $pwd.Path -Uninstall
          Start-Sleep -Seconds 8
          if (Test-Path $root) { throw 'Install root retained' }
          if (Test-Path "$HOME\.fake-thermal-resolve.json") { throw 'Resolve config retained' }
